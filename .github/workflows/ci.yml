name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-14

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          cache: true
      - name: Verify release metadata
        run: |
          pixi_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pixi.toml)
          bash scripts/check-release.sh --metadata-only "v${pixi_version}"
      - name: Verify locked workspace
        run: pixi run --locked check

  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
            subdir: linux-64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            subdir: linux-aarch64
          - name: macOS ARM64
            os: macos-14
            subdir: osx-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare isolated source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/yuragi-source"
          git archive HEAD | tar -x -C "${RUNNER_TEMP}/yuragi-source"
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          cache: true
          working-directory: ${{ runner.temp }}/yuragi-source
      - name: Build and test installed package
        working-directory: ${{ runner.temp }}/yuragi-source
        run: pixi run --locked package
      - name: Validate emitted package index
        working-directory: ${{ runner.temp }}/yuragi-source
        run: |
          pixi_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pixi.toml)
          bash scripts/check-package.sh yuragi "$pixi_version" "${{ matrix.subdir }}"
