name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-contract:
    name: Verify release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify annotated tag, versions, dependencies, and changelog
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          bash scripts/check-release.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

  archive:
    name: Build canonical source archive
    needs: release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create source archive and checksum
        run: bash scripts/source-artifact.sh create "$GITHUB_SHA" "yuragi-${GITHUB_REF_NAME}" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-archive
          path: |
            yuragi-${{ github.ref_name }}.tar.gz
            yuragi-${{ github.ref_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  source-check:
    name: Check source archive on ${{ matrix.name }}
    needs: archive
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-archive
          path: ${{ runner.temp }}/archive
      - name: Verify and extract canonical source
        shell: bash
        run: bash scripts/source-artifact.sh restore "yuragi-${GITHUB_REF_NAME}" "${RUNNER_TEMP}/archive" "${RUNNER_TEMP}/source"
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          cache: true
          working-directory: ${{ runner.temp }}/source
      - name: Verify canonical source and extracted CLI
        working-directory: ${{ runner.temp }}/source
        run: |
          pixi run --locked check
          pixi run --locked bash scripts/check-source-artifact.sh

  package:
    name: Package source archive on ${{ matrix.name }}
    needs: archive
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
            subdir: linux-64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            subdir: linux-aarch64
          - name: macOS ARM64
            os: macos-14
            subdir: osx-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-archive
          path: ${{ runner.temp }}/archive
      - name: Verify and extract canonical source
        shell: bash
        run: bash scripts/source-artifact.sh restore "yuragi-${GITHUB_REF_NAME}" "${RUNNER_TEMP}/archive" "${RUNNER_TEMP}/source"
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          cache: true
          working-directory: ${{ runner.temp }}/source
      - name: Build and test installed package
        working-directory: ${{ runner.temp }}/source
        run: pixi run --locked package
      - name: Validate emitted package index
        working-directory: ${{ runner.temp }}/source
        run: |
          pixi_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pixi.toml)
          bash scripts/check-package.sh yuragi "$pixi_version" "${{ matrix.subdir }}"

  publish:
    name: Publish source release
    needs: [archive, source-check, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-archive
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "yuragi-${GITHUB_REF_NAME}.tar.gz" \
            "yuragi-${GITHUB_REF_NAME}.tar.gz.sha256" \
            --verify-tag --generate-notes \
            --title "Yuragi ${GITHUB_REF_NAME}"
