[workspace]
authors = ["Ameyanagi <contact@ameyanagi.com>"]
channels = [
    "https://ameyanagi.github.io/mojo-channel",
    "https://conda.modular.com/max",
    "conda-forge",
]
name = "yuragi"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
bench-fair = { cmd = "mojo run --Werror -I src benchmarks/bench_fair_compare.mojo", description = "Run the fair Yuru/Yuragi plain-search comparison protocol" }
bench-interactive-state = { cmd = "mojo run --Werror -I src benchmarks/bench_interactive_state.mojo", description = "Profile empty-query interactive state construction and copying" }
bench-search = { cmd = "mojo run --Werror -I src benchmarks/bench_search.mojo", description = "Benchmark bounded interactive search orchestration" }
build = { cmd = "mkdir -p .pixi/bin && mojo build --Werror -I src src/yuragi/main.mojo -o .pixi/bin/yuragi", description = "Build the Yuragi executable with warnings as errors" }
check = { depends-on = ["format-check", "readme-check", "test", "test-cli", "test-interactive"], description = "Run the complete validation suite" }
example = { cmd = "mojo run --Werror -I src examples/basic.mojo", description = "Run the structural smoke example" }
format = { cmd = "bash scripts/format.sh", description = "Format Mojo source files" }
format-check = { cmd = "bash scripts/check-format.sh", description = "Verify Mojo formatting without modifying source" }
package = { cmd = "rattler-build build --recipe conda.recipe/recipe.yaml -c https://ameyanagi.github.io/mojo-channel -c conda-forge -c https://conda.modular.com/max -c https://repo.prefix.dev/modular-community", description = "Build the local Conda package" }
readme-check = { cmd = "bash scripts/check-readme.sh", description = "Compile README Mojo examples" }
test = { cmd = "bash scripts/test.sh", description = "Run all Mojo TestSuite files" }
test-cli = { cmd = "bash scripts/test-cli.sh", depends-on = ["build"], description = "Verify the compiled noninteractive CLI contract" }
test-interactive = { cmd = "bash scripts/test-interactive.sh", depends-on = ["build"], description = "Verify the compiled interactive PTY contract" }
yuragi = { cmd = ".pixi/bin/yuragi", depends-on = ["build"], description = "Run the local Yuragi executable" }

[dependencies]
mojo = "==1.0.0"
mojo-hibana = "==0.1.0"
mojo-moji = "==0.1.0"
mojo-mojotui = "==0.1.1"
mojo-yomi = "==0.1.1"
rattler-build = ">=0.74,<0.75"
