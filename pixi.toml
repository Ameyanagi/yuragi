[workspace]
authors = ["Ameyanagi <contact@ameyanagi.com>"]
channels = [
    "file:///Users/ryuichi/dev/hibana/output",
    "file:///Users/ryuichi/dev/mojotui/output",
    "file:///Users/ryuichi/dev/moji/output",
    "https://conda.modular.com/max",
    "conda-forge",
]
name = "yuragi"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.0.0"

[tasks]
build = { cmd = "mkdir -p .pixi/bin && mojo build --Werror -I src src/yuragi/main.mojo -o .pixi/bin/yuragi", description = "Build the Yuragi executable with warnings as errors" }
check = { depends-on = ["format-check", "test", "test-cli", "test-interactive"], description = "Run the complete validation suite" }
example = { cmd = "mojo run --Werror -I src examples/basic.mojo", description = "Run the structural smoke example" }
format = { cmd = "bash scripts/format.sh", description = "Format Mojo source files" }
format-check = { cmd = "bash scripts/check-format.sh", description = "Verify Mojo formatting without modifying source" }
package = { cmd = "rattler-build build --recipe conda.recipe/recipe.yaml -c file:///Users/ryuichi/dev/hibana/output -c file:///Users/ryuichi/dev/mojotui/output -c file:///Users/ryuichi/dev/moji/output -c conda-forge -c https://conda.modular.com/max -c https://repo.prefix.dev/modular-community", description = "Build the local Conda package" }
test = { cmd = "bash scripts/test.sh", description = "Run all Mojo TestSuite files" }
test-cli = { cmd = "bash scripts/test-cli.sh", depends-on = ["build"], description = "Verify the compiled noninteractive CLI contract" }
test-interactive = { cmd = "bash scripts/test-interactive.sh", depends-on = ["build"], description = "Verify the compiled interactive PTY contract" }
yuragi = { cmd = ".pixi/bin/yuragi", depends-on = ["build"], description = "Run the local Yuragi executable" }

[dependencies]
mojo = "==1.0.0"
rattler-build = ">=0.74,<0.75"

# Wave 3 packaging proof: hibana is consumed as an installed Conda package
# from a local file:// channel built out of the sibling checkout. The local
# channel only serves osx-arm64 today, so the dependency is scoped to the
# platform it can resolve on; it moves to [dependencies] once hibana
# publishes to a hosted channel for every supported platform.
[target.osx-arm64.dependencies]
mojo-hibana = "*"
mojo-mojotui = "*"
