context:
  version: "0.1.0"

package:
  name: yuragi
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    - mkdir -p ${{ PREFIX }}/bin
    - mojo build --Werror -I ${{ PREFIX }}/lib/mojo -I src src/yuragi/main.mojo -o ${{ PREFIX }}/bin/yuragi

requirements:
  build:
    - mojo-compiler ==1.0.0
    - mojo-hibana ==0.1.0
    - mojo-moji ==0.1.0
    - mojo-mojotui ==0.1.2
    - mojo-yomi ==0.1.2
  host:
    - mojo-compiler ==1.0.0
    - mojo-hibana ==0.1.0
    - mojo-moji ==0.1.0
    - mojo-mojotui ==0.1.2
    - mojo-yomi ==0.1.2
  run:
    - mojo-compiler ==1.0.0
    - mojo-hibana ==0.1.0
    - mojo-moji ==0.1.0
    - mojo-mojotui ==0.1.2
    - mojo-yomi ==0.1.2

tests:
  - script:
      - test "$(yuragi --version)" = "yuragi 0.1.0"
      - printf 'apple\nbanana\n' | yuragi --filter ba > direct.txt
      - printf 'banana\n' > direct.expected
      - cmp direct.expected direct.txt
      - printf '北京大学\n上海\n' | yuragi --lang zh --filter bjdx > zh.txt
      - printf '北京大学\n' > zh.expected
      - cmp zh.expected zh.txt
      - printf 'カメラ\n東京\n' | yuragi --lang ja --filter kamera > ja.txt
      - printf 'カメラ\n' > ja.expected
      - cmp ja.expected ja.txt
      - printf 'カメラ\n日本語\n' | yuragi --lang ja --filter 'カ' > ja-native.txt 2> ja-native.stderr
      - cmp ja.expected ja-native.txt
      - test ! -s ja-native.stderr
      - printf '한글\n서울\n' | yuragi --lang ko --filter hangeul > ko.txt
      - printf '한글\n' > ko.expected
      - cmp ko.expected ko.txt

about:
  homepage: https://github.com/Ameyanagi/yuragi
  repository: https://github.com/Ameyanagi/yuragi
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
  summary: A CJK-aware fuzzy finder written in Mojo.

extra:
  maintainers:
    - Ameyanagi
